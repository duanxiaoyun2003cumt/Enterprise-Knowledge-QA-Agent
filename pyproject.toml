[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-agent"
version = "0.1.0"
description = "Enterprise Knowledge QA Agent (phase 1: contracts and model plumbing)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40,<3",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
